  body: >-
    Specimen K-12 developed cervical armor this morning. Nothing inside the enclosure threatened its neck.
    At 16:22 the north fence collapsed onto it; the new plates prevented a fatal injury. I am increasingly
    uncomfortable calling this a mutation. Evolution is supposed to answer something that has already happened.
